<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - Wenlo Todos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .coming-soon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 4rem;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: float-card 6s ease-in-out infinite;
    }

    @keyframes float-card {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .glow-text {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #a5a5a5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    .subtitle-text {
      color: var(--text-muted, #94a3b8);
      font-size: 1.25rem;
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: #ffffff;
      color: #000000;
      border-radius: 99px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Background effects */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(109, 91, 208, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Light mode overrides */
    [data-theme="light"] .glass-card {
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
    }

    [data-theme="light"] .glow-text {
      background: linear-gradient(135deg, #1f2937 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    [data-theme="light"] .subtitle-text {
      color: #475569;
    }

    [data-theme="light"] .back-btn {
      background: #1f2937;
      color: #ffffff;
    }

    [data-theme="light"] .back-btn:hover {
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  
  <!-- Theme Toggle Bottom Left -->
  <div class="theme-controls">



    <div class="theme-toggle">
      <button id="btn-dark-mode" class="theme-btn active">Dark</button>
      <button id="btn-light-mode" class="theme-btn inactive">Light</button>
    </div>

    <div class="theme-picker">




      <!-- These dots represent the chaos of choice -->
      <button class="theme-picker-btn" data-theme="lavender" style="background: #6D5BD0;" title="Lavender & Ash">
      </button>
      <button class="theme-picker-btn" data-theme="amber" style="background: #F59E0B;" title="Amber & Onyx"></button>
      <button class="theme-picker-btn" data-theme="sage" style="background: #636A51;" title="Sage & Wood"></button>
      <button class="theme-picker-btn" data-theme="ocean" style="background: #3B82F6;" title="Ocean & Mist"></button>
      <button class="theme-picker-btn" data-theme="charcoal" style="background: #64748B;"
        title="Charcoal & Sand"></button>
      <button class="theme-picker-btn" data-theme="red" style="background: #B91C1C;" title="Red & Ivory"></button>



    </div>
  </div>

  <main class="coming-soon-container">
    <div class="glass-card">
      <h1 class="glow-text">Coming Soon</h1>
      <p class="subtitle-text">We're working hard to bring you this feature. <br>Stay tuned for something amazing.</p>
      
      <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return Home
      </a>
    </div>
  </main>

  <script src="themes.js"></script>
</body>
</html>
