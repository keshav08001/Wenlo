<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">



  <title>Coming Soon - Wenlo Todos</title>




  <link rel="stylesheet" href="style.css">



  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">











  <style>
    .coming-soon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .glass-card {
      background: var(--nav-bg, rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--nav-border, rgba(255, 255, 255, 0.05));
      border-radius: 24px;
      padding: 4rem;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: float-card 6s ease-in-out infinite;
    }

    @keyframes float-card {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }


    .glow-text {
    font-size: 4rem;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        var(--magic-gradient-start, #ffffff) 0%,
        var(--magic-gradient-end, #a5a5a5) 100%
    );

    background-clip: text;
    -webkit-background-clip: text;

    color: transparent;
    -webkit-text-fill-color: transparent;

    margin-bottom: 1rem;
    letter-spacing: -1px;
}





    .subtitle-text {
      color: var(--text-muted, #94a3b8);
      font-size: 1.25rem;
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: var(--pill-color, #ffffff);
      color: var(--bg, #000000);
      border-radius: 99px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Background effects */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--magic-gradient-start, rgba(109, 91, 208, 0.15)) 0%, transparent 70%);
      opacity: 0.15;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }
  </style>















</head>

<body>


  <div class="bg-glow"></div>



  <!-- theme controls so it doesn't break if themes.js runs -->
  <div class="theme-controls" style="display: none;">
    <div class="theme-toggle">


      <button id="btn-dark-mode" class="theme-btn active">Dark</button>
      <button id="btn-light-mode" class="theme-btn inactive">Light</button>
    </div>
  </div>



  <main class="coming-soon-container">


    <div class="glass-card">

      <h1 class="glow-text">Coming Soon</h1>
      <p class="subtitle-text">We're working hard to bring you this feature. <br>Stay tuned for something amazing.</p>

      <a href="index.html" class="back-btn">



        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>



          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return Home
      </a>




    </div>


  </main>

  <script src="themes.js"></script>




</body>


</html>
