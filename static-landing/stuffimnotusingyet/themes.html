<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themes - Wenlo Todos</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>




    /* Claude's variables merged with my defaults */




    
    :root {
      --surface: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.09);
    }
    
    [data-theme="light"] {
      --surface: rgba(0, 0, 0, 0.05);
      --line: rgba(0, 0, 0, 0.1);
    }

    .themes-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      z-index: 10;
      padding: 4rem 2rem;
      max-width: 1040px;
      margin: 0 auto;
    }

    .bg-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, var(--magic-gradient-start, rgba(109, 91, 208, 0.15)) 0%, transparent 70%);
      opacity: 0.15;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }





    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 40px;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 30px;
      z-index: 1;
    }
    header h1 {
      font-size: clamp(34px, 6vw, 60px);
      line-height: .98;
      font-weight: 800;
      letter-spacing: -.03em;
      margin: 0;
      max-width: 11ch;
      background: linear-gradient(135deg, var(--magic-gradient-start, #ffffff) 0%, var(--magic-gradient-end, #a5a5a5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      margin: 0;
      max-width: 34ch;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      backdrop-filter: blur(12px);
    }
    .toggle button {
      font-family: inherit;
      font-size: 14px;
      border: 0;
      background: none;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .toggle button[aria-pressed=true] {
      background: var(--a1, var(--pill-color, #ffffff));
      color: var(--bg);
      font-weight: 600;
    }








    /* Live Preview Section */
    .live {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 26px;
      transition: background .35s;
      backdrop-filter: blur(20px);
      z-index: 1;
    }
    .live .copy {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 30px;
    }
    .live .copy small {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .live .copy h2 {
      margin: 6px 0 0;
      font-size: clamp(26px, 4vw, 40px);
      letter-spacing: -.02em;
      font-weight: 800;
      line-height: 1.05;
    }
    .live .copy p {
      margin: 10px 0 0;
      color: var(--text-muted);
      max-width: 32ch;
      line-height: 1.5;
    }
    .live .copy .sw {
      display: flex;
      gap: 8px;
    }
    .live .copy .sw i {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line);
    }
    .stage {
      background: var(--a2, rgba(255,255,255,0.05));
      padding: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .35s;
    }












    /* Mini Dashboard CSS */
    .mini {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 16/10;
      border-radius: 10px;
      background: var(--bg);
      display: grid;
      grid-template-columns: 28% 1fr;
      overflow: hidden;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,.6);
      transition: background .35s;
    }
    .mini .sb {
      background: var(--surface);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mini .sb b {
      height: 6px;
      border-radius: 3px;
      background: var(--text-muted);
      opacity: .35;
    }
    .mini .sb b:first-child {
      background: var(--a1, var(--pill-color));
      opacity: 1;
      width: 60%;
    }
    .mini .mn {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .mini .mn b {
      height: 7px;
      border-radius: 3px;
      background: var(--text);
      opacity: .85;
      width: 55%;
    }
    .mini .mn i {
      height: 5px;
      border-radius: 3px;
      background: var(--text-muted);
      opacity: .4;
      display: block;
    }
    .mini .mn u {
      margin-top: auto;
      align-self: flex-start;
      height: 16px;
      width: 46px;
      border-radius: 5px;
      background: var(--a1, var(--pill-color));
    }













    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: stretch;
      z-index: 1;
      margin-bottom: 3rem;
    }
    .card {
      all: unset;
      box-sizing: border-box;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      background: var(--c-surface);
      color: var(--c-text);
      border: 1px solid var(--c-line);
      border-radius: 16px;
      padding: 14px 14px 18px;
      transition: transform .18s, border-color .18s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--c-a1);
    }
    .card:focus-visible {
      outline: 2px solid var(--c-a1);
      outline-offset: 3px;
    }
    .card[aria-checked=true] {
      border-color: var(--c-a1);
      box-shadow: 0 0 0 1px var(--c-a1);
    }
    .card .mini {
      max-width: none;
      margin-bottom: 14px;
      background: var(--c-bg);
      box-shadow: none;
      border: 1px solid var(--c-line);
    }
    .card .mini .sb { background: var(--c-surface); }
    .card .mini .sb b { background: var(--c-muted); }
    .card .mini .sb b:first-child { background: var(--c-a1); }
    .card .mini .mn b { background: var(--c-text); }
    .card .mini .mn i { background: var(--c-muted); }
    .card .mini .mn u { background: var(--c-a1); }
    .card h3 {
      margin: 0 4px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .card p {
      margin: 4px 4px 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--c-muted);
    }
    .card .tick {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--c-a1);
      color: var(--c-bg);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }
    .card[aria-checked=true] .tick {
      display: flex;
    }

    .coming-soon-card {
      grid-column: 1 / -1;
      justify-self: center;
      width: 100%;
      max-width: 320px;
      border-style: dashed !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      cursor: default;
      background: transparent !important;
      text-align: center;
      padding: 30px;
    }

    .coming-soon-card:hover {
      transform: none;
      border-color: inherit;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: var(--pill-color, #ffffff);
      color: var(--bg, #000000);
      border-radius: 99px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      margin: 0 auto;
      z-index: 1;
    }
    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .live { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .themes-container { padding-top: 28px; }
    }















    
  </style>
</head>

<body>
  <div class="bg-glow"></div>

  <main class="themes-container">
    <header>
      <h1>Dress up your workspace</h1>
      <p>Six palettes, each shown as it will actually look. Pick one and the whole page changes.</p>
      <div class="toggle" role="group" aria-label="Mode">
        <button id="m-dark" aria-pressed="true">Dark</button>
        <button id="m-light" aria-pressed="false">Light</button>
      </div>
    </header>

    <section class="live" aria-live="polite">
      <div class="copy">
        <div>
          <small>Current theme</small>
          <h2 id="cur-name"></h2>
          <p id="cur-desc"></p>
        </div>
        <div class="sw" id="cur-sw"></div>
      </div>
      <div class="stage">
        <div class="mini">
          <div class="sb"><b></b><b></b><b></b><b></b></div>
          <div class="mn"><b></b><i></i><i style="width:80%"></i><i style="width:65%"></i><u></u></div>
        </div>
      </div>
    </section>

    <div class="grid" id="grid" role="radiogroup" aria-label="Themes">
      <!-- Cards injected by JS -->
    </div>

    <a href="index.html" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Return Home
    </a>
  </main>

  <script src="themes.js"></script>
  <script>
    // Claude's specific colors for the mini previews
    var T = [
      {n: "Lavender & Ash", d: "Soft and elegant. Probably smells nice.",
       dk: {bg: "#14121a", s: "#1d1a27", t: "#ece8f5", m: "#9a93ad", a: "#8f78ef", b: "#2b2542"},
       lt: {bg: "#f3f0f8", s: "#ffffff", t: "#231d33", m: "#6b6380", a: "#5a47b8", b: "#d9d0f0"}},
      {n: "Amber & Onyx", d: "Bold and confident. Drinks black coffee.",
       dk: {bg: "#0f1114", s: "#181b20", t: "#f1ece2", m: "#98958b", a: "#e8a33d", b: "#2a3142"},
       lt: {bg: "#f6f1e6", s: "#fffdf8", t: "#1d1a14", m: "#6f6a5c", a: "#c27d12", b: "#e7d9b8"}},
      {n: "Sage & Wood", d: "Earth mother. Owns 14 plants.",
       dk: {bg: "#12140f", s: "#1b1e17", t: "#e9ebe0", m: "#959a85", a: "#8fa078", b: "#3b3a2c"},
       lt: {bg: "#eef0e6", s: "#fafbf5", t: "#20241a", m: "#666d57", a: "#5f7050", b: "#d5d9c2"}},
      {n: "Ocean & Mist", d: "Clean and focused. Slightly wet.",
       dk: {bg: "#0b1220", s: "#121b2e", t: "#e6eefc", m: "#8a9ab8", a: "#4a82f0", b: "#1c2c5c"},
       lt: {bg: "#eaf1fb", s: "#ffffff", t: "#0f1b33", m: "#5a6a87", a: "#2f6be0", b: "#c9dafb"}},
      {n: "Charcoal & Sand", d: "Modern, minimal, not for grilling.",
       dk: {bg: "#121315", s: "#1b1c1f", t: "#ece9e2", m: "#96938a", a: "#c9b99a", b: "#2c2f38"},
       lt: {bg: "#f1eee8", s: "#fcfbf8", t: "#1c1c1e", m: "#6a675f", a: "#8f7c58", b: "#ddd5c4"}},
      {n: "Red & Ivory", d: "Spicy and energetic. Will fight you.",
       dk: {bg: "#160f0f", s: "#211616", t: "#f6eee3", m: "#a89489", a: "#e0524a", b: "#4a1d1b"},
       lt: {bg: "#f8f1e6", s: "#fffaf1", t: "#2a1512", m: "#7a625a", a: "#b3261e", b: "#f1c9c4"}}
    ];
    
    var themeKeys = ["lavender", "amber", "sage", "ocean", "charcoal", "red"];
    var mode = isLivingInTheDark ? "dark" : "light";
    var cur = themeKeys.indexOf(currentVibe) !== -1 ? themeKeys.indexOf(currentVibe) : 4;

    function vars(p, pre) {
      var l = pre ? "--c-" : "--";
      return l+"bg:"+p.bg+";"+l+"surface:"+p.s+";"+l+"text:"+p.t+";"+l+"muted:"+p.m+";"+l+"a1:"+p.a+";"+l+"a2:"+p.b+";"+l+"line:"+p.t+"22;";
    }

    var grid = document.getElementById("grid");
    T.forEach(function(t, i) {
      var b = document.createElement("button");
      b.className = "card";
      b.setAttribute("role", "radio");
      b.dataset.i = i;
      b.innerHTML = '<span class="tick">&#10003;</span><div class="mini"><div class="sb"><b></b><b></b><b></b></div><div class="mn"><b></b><i></i><i style="width:78%"></i><u></u></div></div><h3>'+t.n+'</h3><p>'+t.d+'</p>';
      b.onclick = function() {
        cur = i;
        applyLocalUI();
        // Hook into our site-wide themes.js logic!
        slapThemeOnDom(themeKeys[cur], mode === "dark");
      };
      grid.appendChild(b);
    });

    // Add the "More Vibes" card at the end of the grid
    var soonCard = document.createElement("div");
    soonCard.className = "card coming-soon-card";
    soonCard.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; color: var(--text-muted);"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg><h3 style="color: var(--text-muted);">More Vibes</h3><p style="text-align: center; color: var(--text-muted);">Coming very soon...</p>';
    grid.appendChild(soonCard);

    function applyLocalUI() {
      var k = mode === "dark" ? "dk" : "lt", p = T[cur][k], r = document.documentElement;
      
      // Update our custom Claude CSS vars for the preview UI
      var styleString = vars(p, false);
      // We append it to the document body to not override the global theme classes set by themes.js on root
      document.body.setAttribute("style", styleString);

      document.querySelectorAll(".card:not(.coming-soon-card)").forEach(function(c, i) {
        var q = T[i][k];
        c.setAttribute("style", vars(q, true));
        c.setAttribute("aria-checked", i === cur ? "true" : "false");
      });
      
      document.getElementById("cur-name").textContent = T[cur].n;
      document.getElementById("cur-desc").textContent = T[cur].d;
      document.getElementById("cur-sw").innerHTML = '<i style="background:'+p.a+'"></i><i style="background:'+p.b+'"></i><i style="background:'+p.s+'"></i>';
      document.getElementById("m-dark").setAttribute("aria-pressed", mode === "dark");
      document.getElementById("m-light").setAttribute("aria-pressed", mode === "light");
    }

    document.getElementById("m-dark").onclick = function() {
      mode = "dark";
      applyLocalUI();
      slapThemeOnDom(themeKeys[cur], true);
    };
    
    document.getElementById("m-light").onclick = function() {
      mode = "light";
      applyLocalUI();
      slapThemeOnDom(themeKeys[cur], false);
    };

    // Initialize UI on load
    applyLocalUI();
  </script>
</body>
</html>
